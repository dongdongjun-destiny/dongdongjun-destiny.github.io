# Site Settings
title: "Yidong Zhang"
description: "M.Sc. student in Electronic Engineering at CUHK. Research in medical/endoscopic robotics, vision-language-action models, imitation learning, and robot foundation models."
repository: "dongdongjun-destiny/dongdongjun-destiny.github.io"
url: "https://dongdongjun-destiny.github.io"
baseurl: ""
google_scholar_stats_use_cdn: true

# google analytics
google_analytics_id:

# SEO Related
google_site_verification:
bing_site_verification:
baidu_site_verification:

# Site Author
author:
  name: "Yidong Zhang"
  avatar: "images/avatar.png"
  bio: "CUHK"
  location: "Hong Kong"
  employer:
  pubmed:
  googlescholar:
  email: "1155238074@link.cuhk.edu.hk"
  researchgate:
  uri:
  bitbucket:
  codepen:
  dribbble:
  flickr:
  facebook:
  foursquare:
